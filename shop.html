<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop | Zero Waste Drafting</title>
  <link rel="canonical" href="index.html#products">
  <script>
    (function () {
      var topics = {
        lss: "lean-six-sigma",
        cad: "cad",
        lighting: "lighting-controls",
        bundles: "bundles",
        licenses: "classroom-license",
        prints: "extras",
        free: "free-quiz",
        all: "products"
      };
      var params = new URLSearchParams(location.search);
      var hash = (location.hash || "").replace(/^#/, "");
      var topic = params.get("topic");
      var id = hash || (topic && topics[topic]) || "products";
      location.replace("index.html#" + id);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=index.html#products">
</head>
<body>
  <p><a href="index.html#products">Products</a></p>
</body>
</html>
